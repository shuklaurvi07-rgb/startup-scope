<header><div class="in"><div class="top"><div class="brand">Pitch Analyzer<small>Investment screening platform</small></div>
<div class="noprint"><button class="btn" onclick="report()">Download report</button></div></div><nav id="nav"></nav></div></header>
<main id="m"></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={st:[],sel:0,tab:'up',w:{fin:20,gro:20,mkt:15,mgt:15,val:15,risk:15},sc:null,conv:0,ai:{}};
const DIMS=[['fin','Financial Health'],['gro','Growth & Unit Economics'],['mkt','Market Attractiveness'],['mgt','Management & Product'],['val','Valuation Attractiveness'],['risk','Risk']];
const TABS=[['up','Upload'],['db','Dashboard'],['sc','Score & Weights'],['rf','Red Flags'],['au','Autopsy'],['stt','Stress Test'],['cmp','Compare'],['ic','IC View']];
const cl=x=>Math.max(0,Math.min(1,x)),fm=v=>v==null||isNaN(v)?'Unknown':Math.abs(v)>=1e3?v.toLocaleString(undefined,{maximumFractionDigits:0}):(+v.toFixed(2)).toString(),pc=v=>v==null||!isFinite(v)?'Unknown':(v*100).toFixed(1)+'%',rt=v=>Math.abs(v)>1.5?v/100:v;
function num(v){if(typeof v==='number')return v;if(v==null)return NaN;let s=String(v).trim().replace(/[₹$€£,\s%]/g,'').replace(/(crore|cr|million|mn|billion|bn|m|b|k|x)$/i,'');if(/^\(.*\)$/.test(s))s='-'+s.slice(1,-1);if(s===''||isNaN(s))return NaN;S.conv++;return parseFloat(s)}
const isP=h=>h!=null&&String(h).trim().length<=12&&/^(fy|cy|h[12]|q[1-4])?[\s'-]*(20)?\d{2}\b/i.test(String(h).trim());
/* ---------- ingestion ---------- */
function table(ws){const a=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true}),n=r=>(r||[]).filter(x=>x!=null&&x!=='').length,cs=a.slice(0,40).map(n),mx=Math.max(0,...cs);if(mx<2)return null;
 let h=cs.findIndex((c,i)=>c>=Math.max(2,.6*mx)&&n(a[i+1])>=2);if(h<0)h=cs.indexOf(mx);const hdr=a[h].map((x,i)=>x==null?'col'+i:String(x).trim()),rows=a.slice(h+1).filter(r=>n(r)>=2),pi=hdr.map((x,i)=>isP(x)?i:-1).filter(i=>i>=0);
 return{hdr,rows,pi,h,blanks:rows.reduce((s,r)=>s+hdr.filter((_,i)=>r[i]==null||r[i]==='').length,0)}}
async function load(files){for(const f of files){try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),M=[],txt={};let blanks=0,sheets=0;
 wb.SheetNames.forEach(sn=>{const t=table(wb.Sheets[sn]);if(!t)return;sheets++;blanks+=t.blanks;
  if(t.pi.length>=2){const lab=t.hdr.findIndex((_,i)=>!t.pi.includes(i));t.rows.forEach((r,ri)=>{if(r[lab]==null)return;const ser=t.pi.map(i=>({p:t.hdr[i],v:num(r[i])})).filter(z=>!isNaN(z.v));if(ser.length)M.push({label:String(r[lab]),ser,v:ser[ser.length-1].v,src:`${sn} → ${r[lab]}`,row:t.h+2+ri})})}
  else{const lk=t.hdr.findIndex(k=>/metric|item|parameter|field|kpi|name|particular/i.test(k)),vk=t.hdr.findIndex(k=>/value|amount|figure|detail|description/i.test(k)),li=lk>=0?lk:0,vi=vk>=0&&vk!==li?vk:(li===0?1:0);
   t.rows.forEach((r,ri)=>{if(r[li]==null)return;const x=num(r[vi]);if(!isNaN(x))M.push({label:String(r[li]),ser:[{p:'—',v:x}],v:x,src:`${sn} → ${r[li]}`,row:t.h+2+ri});else if(r[vi]!=null)txt[String(r[li])]=String(r[vi])})}});
 let name=Object.entries(txt).find(([k])=>/^(company|startup|name)/i.test(k));name=name?name[1]:f.name.replace(/\.[^.]+$/,'');
 if(!M.length&&!Object.keys(txt).length)throw new Error('No tables detected');
 S.st=S.st.filter(s=>s.file!==f.name);S.st.push(analyze({id:Date.now()+Math.random(),file:f.name,name,M,txt,blanks,sheets}))}catch(e){alert(f.name+': '+e.message)}}
 S.sel=Math.max(0,Math.min(S.sel,S.st.length-1));S.sc=null;go(S.tab==='up'&&S.st.length?'db':S.tab)}
/* ---------- calculations ---------- */
const PAT={rev:[/revenue|sales|turnover/i,/per|growth|%|cagr|share|target|forecast|project|market|cost/i],gp:[/gross (profit|margin)/i,0],ebm:[/ebitda margin/i,0],eb:[/ebitda/i,/margin|%/i],ni:[/net (income|profit|loss)|^pat\b/i,/margin/i],cash:[/cash (balance|in bank|&|and)|closing cash|^cash$/i,/flow/i],burn:[/burn/i,0],ocf:[/operating cash|cfo/i,0],cust:[/customers|users|clients|subscribers|accounts/i,/per|new|churn|acqui|cost|growth|lost|%/i],cac:[/\bcac\b|acquisition cost/i,0],ltv:[/\bltv\b|lifetime value/i,/ratio|\//i],churn:[/churn/i,0],ret:[/retention|nrr/i,0],ask:[/(funding|raise|raising|capital).*(requir|ask|sought|need)|^ask|amount raising/i,0],pre:[/pre.?money/i,0],post:[/post.?money/i,0],tam:[/\btam\b|total addressable/i,0],sam:[/\bsam\b|serviceable addressable/i,0],som:[/\bsom\b|serviceable obtainable/i,0],mg:[/market.*(growth|cagr)|(industry|sector).*growth/i,0],exp:[/(founder|team|management).*(experience|years)|years of experience/i,0],comp:[/competitor/i,/revenue|share/i],proj:[/(projected|forecast).*(growth|cagr)/i,0],cm:[/contribution margin/i,0]};
function analyze(s){const g=k=>{const[p,e]=PAT[k];return s.M.find(m=>p.test(m.label)&&(!e||!e.test(m.label)))},F={};Object.keys(PAT).forEach(k=>F[k]=g(k));s.F=F;const c=s.c={},L=m=>m?m.v:NaN;
 const rev=F.rev;c.rev=L(rev);if(rev&&rev.ser.length>1){const a=rev.ser;c.g=a[a.length-1].v/a[a.length-2].v-1;c.cagr=a[0].v>0?Math.pow(a[a.length-1].v/a[0].v,1/(a.length-1))-1:NaN}
 const marg=(m,r)=>{if(!m)return NaN;if(/margin|%/i.test(m.label))return rt(m.v);return r>0?m.v/r:NaN};c.gm=marg(F.gp,c.rev);c.ebm=F.ebm?rt(F.ebm.v):marg(F.eb,c.rev);c.nm=marg(F.ni,c.rev);
 c.cash=L(F.cash);c.burn=F.burn?(/year|annual/i.test(F.burn.label)?F.burn.v/12:F.burn.v):(F.ocf&&F.ocf.v<0?-F.ocf.v/12:NaN);c.runway=c.cash>0&&c.burn>0?c.cash/c.burn:NaN;
 c.cust=L(F.cust);if(F.cust&&F.cust.ser.length>1){const a=F.cust.ser;c.cg=a[a.length-1].v/a[a.length-2].v-1}c.rpc=c.rev/c.cust;c.cac=L(F.cac);c.ltv=L(F.ltv);c.ltvcac=c.ltv/c.cac;c.churn=F.churn?rt(F.churn.v):NaN;c.ret=F.ret?rt(F.ret.v):NaN;
 c.ask=L(F.ask);c.pre=L(F.pre);c.post=L(F.post)||(c.pre&&c.ask?c.pre+c.ask:NaN);c.evrev=c.post/c.rev;c.tam=L(F.tam);c.sam=L(F.sam);c.som=L(F.som);c.mg=F.mg?rt(F.mg.v):NaN;c.pen=c.rev/c.tam;c.proj=F.proj?rt(F.proj.v):NaN;c.exp=L(F.exp);c.comp=L(F.comp);c.cm=F.cm?rt(F.cm.v):NaN;
 s.flags=flags(s);score(s);autopsy(s);return s}
function flags(s){const c=s.c,F=s.F,o=[],a=(issue,sev,ev,why,q)=>o.push({issue,sev,ev,why,q}),sr=k=>F[k]?F[k].src:'';
 [['gm',s.F.gp],['ebm',F.ebm||F.eb],['churn',F.churn],['ret',F.ret]].forEach(([k,m])=>{if(m&&/margin|%|churn|retention/i.test(m.label)&&Math.abs(m.v)>100)a('Impossible percentage','High',`${m.src} = ${m.v}`,'Percentages beyond ±100% indicate data or unit errors.',`Confirm the unit and source of ${m.label}.`)});
 if(F.gp&&F.rev&&!/margin|%/i.test(F.gp.label)&&F.gp.v>F.rev.v)a('Gross profit exceeds revenue','High',`${sr('gp')} (${fm(F.gp.v)}) > ${sr('rev')} (${fm(F.rev.v)})`,'Mathematically inconsistent.','Reconcile gross profit with the P&L.');
 if(c.ebm>c.gm)a('EBITDA margin exceeds gross margin','High',`EBITDA ${pc(c.ebm)} vs gross ${pc(c.gm)}`,'Operating profit cannot exceed gross profit without other income.','Provide the full P&L bridge.');
 if(c.tam&&c.sam&&c.sam>c.tam||c.sam&&c.som&&c.som>c.sam)a('TAM/SAM/SOM inconsistency','High',`TAM ${fm(c.tam)}, SAM ${fm(c.sam)}, SOM ${fm(c.som)}`,'SOM ⊆ SAM ⊆ TAM must hold.','What is the sizing methodology and source?');
 if(c.som&&c.rev&&c.som<c.rev)a('Revenue exceeds stated obtainable market','Medium',`Revenue ${fm(c.rev)} > SOM ${fm(c.som)}`,'Market sizing may be understated or mis-scoped.','Reconcile revenue with market definition.');
 if(c.proj>1.5||c.g>3)a('Aggressive growth assumptions','Medium',`Growth ${pc(c.proj||c.g)}`,'Very high growth is rarely sustained and drives valuation.','What drives the growth and what is the evidence?');
 if(c.pre&&c.post&&c.post<c.pre)a('Post-money below pre-money','High',`Pre ${fm(c.pre)}, post ${fm(c.post)}`,'Valuation inputs conflict.','Confirm round terms.');
 if(c.runway<9)a('Short cash runway','High',`Runway ≈ ${fm(c.runway)} months (${sr('cash')}; burn ${fm(c.burn)}/month)`,'Limited time to reach milestones before refinancing.','What is the plan if the round slips 6 months?');
 if(c.ask&&c.burn&&c.ask<c.burn*12)a('Funding ask covers under 12 months of burn','Medium',`Ask ${fm(c.ask)} vs 12-month burn ${fm(c.burn*12)}`,'Raise may be insufficient to reach next milestone.','What milestones does this round fund?');
 if(c.ltvcac<3)a('Weak LTV/CAC','Medium',`LTV/CAC = ${fm(c.ltvcac)}`,'Below ~3x suggests acquisition may not be efficient.','How will CAC fall or LTV rise?');
 if(c.churn>.1)a('High churn','Medium',`Churn ${pc(c.churn)} (${sr('churn')})`,'Erodes recurring revenue and LTV.','What is churn by cohort?');
 if(c.rev&&c.ebm>0&&c.burn>0)a('Profitability vs burn conflict','Medium',`EBITDA margin ${pc(c.ebm)} but burn ${fm(c.burn)}/month`,'Positive EBITDA normally implies no operating burn.','Explain capex/working-capital burn.');
 const cl2=Object.entries(s.txt).filter(([k])=>/claim/i.test(k));cl2.forEach(([k,v])=>a('Unsupported management claim','Low',`${k}: ${v}`,'No matching metric in the workbook.','Provide evidence for this claim.'));
 s.M.forEach(m=>{for(let i=1;i<m.ser.length;i++)if(m.ser[i-1].v>0&&m.ser[i].v/m.ser[i-1].v>6&&!o.some(x=>x.ev.includes(m.src)))a('Suspicious jump in '+m.label,'Low',`${m.src}: ${m.ser[i-1].p}→${m.ser[i].p}`,'Possible unit change or error.','Confirm the figures.')});
 return o}
const DIMX={fin:s=>{const c=s.c,a=[];if(!isNaN(c.gm))a.push(['Gross margin',cl(c.gm/.7),pc(c.gm)]);if(!isNaN(c.ebm))a.push(['EBITDA margin',cl((c.ebm+.5)/.8),pc(c.ebm)]);if(!isNaN(c.runway))a.push(['Runway',cl(c.runway/24),fm(c.runway)+' mo']);if(!isNaN(c.nm))a.push(['Net margin',cl((c.nm+.5)/.8),pc(c.nm)]);return a},
 gro:s=>{const c=s.c,a=[],g=isNaN(c.g)?c.cagr:c.g;if(!isNaN(g))a.push(['Revenue growth',cl(g/1),pc(g)]);if(!isNaN(c.ltvcac))a.push(['LTV/CAC',cl(c.ltvcac/5),fm(c.ltvcac)+'x']);if(!isNaN(c.churn))a.push(['Churn',1-cl(c.churn/.2),pc(c.churn)]);if(!isNaN(c.ret))a.push(['Retention',cl((c.ret-.5)/.6),pc(c.ret)]);return a},
 mkt:s=>{const c=s.c,a=[];if(!isNaN(c.mg))a.push(['Market growth',cl(c.mg/.25),pc(c.mg)]);if(!isNaN(c.pen))a.push(['Headroom (revenue/TAM)',1-cl(c.pen*50),pc(c.pen)]);if(!isNaN(c.comp))a.push(['Competitive intensity',1-cl(c.comp/15),fm(c.comp)+' rivals']);return a},
 mgt:s=>{const c=s.c,a=[];if(!isNaN(c.exp))a.push(['Team experience',cl(c.exp/15),fm(c.exp)+' yrs']);if(!isNaN(c.ret))a.push(['Product stickiness',cl((c.ret-.6)/.5),pc(c.ret)]);if(!isNaN(c.cm))a.push(['Contribution margin',cl(c.cm/.5),pc(c.cm)]);return a},
 val:s=>{const c=s.c,a=[];if(!isNaN(c.evrev))a.push(['Post-money / revenue',1-cl((c.evrev-3)/17),fm(c.evrev)+'x']);return a}};
function score(s){s.dim={};s.sub={};['fin','gro','mkt','mgt','val'].forEach(k=>{const a=DIMX[k](s);s.sub[k]=a;s.dim[k]=a.length?a.reduce((x,y)=>x+y[1],0)/a.length*100:null});
 const pts={High:25,Medium:10,Low:4};s.risk=Math.min(100,s.flags.reduce((x,f)=>x+pts[f.sev],0));s.dim.risk=s.risk;s.sub.risk=s.flags.map(f=>[f.issue,0,f.sev])}
function total(s){let t=0,w=0;DIMS.forEach(([k])=>{const v=k==='risk'?100-s.risk:s.dim[k];if(v!=null){t+=S.w[k]*v;w+=S.w[k]}});return w?t/w:NaN}
function autopsy(s){const c=s.c,o=[];
 if(c.ltvcac<3)o.push(['High CAC relative to LTV (LTV/CAC '+fm(c.ltvcac)+'x)','Higher acquisition spend per customer','Higher burn','Shorter runway'+(c.runway?' (~'+fm(c.runway)+' mo today)':''),'Additional funding needed']);
 if(c.churn>.08)o.push(['Churn at '+pc(c.churn),'Recurring revenue erodes','Growth requires more new-customer spend','Operating leverage weakens','Cash pressure']);
 if(c.runway<15||c.burn>0)o.push(['Cash burn '+fm(c.burn)+'/month','Runway of '+fm(c.runway)+' months','Pressure to raise before milestones','Weaker negotiating position','Dilution or down-round risk']);
 if(c.gm<.5)o.push(['Gross margin '+pc(c.gm),'Limited contribution per sale','Slow path to profitability','Dependence on external capital']);
 if(c.som&&c.rev&&c.rev/c.som>.3)o.push(['Revenue already '+pc(c.rev/c.som)+' of SOM','Slower growth as obtainable market saturates','Pressure on valuation multiple']);
 s.au=o.slice(0,4)}
/* ---------- stress ---------- */
function base(s){const c=s.c;return{g:Math.round(((isNaN(c.g)?c.cagr:c.g)||.2)*100),cg:Math.round((c.cg||.15)*100),cac:0,gm:Math.round((c.gm||.5)*100),oc:10,burn:'',fund:0}}
function proj(s,x){const c=s.c,R=c.rev,gm0=c.gm,gp0=R*gm0,eb0=isNaN(c.ebm)?NaN:R*c.ebm,ox0=gp0-eb0,out=[],cust=c.cust,cac=c.cac;let cash=(c.cash||0)+(+x.fund||0),cum=0;
 for(let t=0;t<=3;t++){const rv=R*Math.pow(1+x.g/100,t),extra=cust&&cac&&t?cust*Math.pow(1+x.cg/100,t)*(x.cg/100)*cac*(x.cac/100):0,eb=rv*x.gm/100-ox0*Math.pow(1+x.oc/100,t)-extra,burn=x.burn!==''?+x.burn:(eb<0?-eb/12:0);
  if(t>0&&t<=2&&eb<0)cum+=-eb;out.push({t,rv,eb,burn,run:burn>0?cash/burn:Infinity})}
 return{rows:out,need:Math.max(0,cum-(c.cash||0)-(+x.fund||0))}}
/* ---------- UI ---------- */
const cur=()=>S.st[S.sel];
function go(t){S.tab=t;$('nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===t?'on':''}" onclick="go('${k}')">${l}</button>`).join('');$('m').innerHTML=(V[t]||V.up)();window.scrollTo(0,0);if(t==='stt')runStress()}
const need=()=>`<div class="card"><h2>No startup loaded</h2><p class="mu">Upload one or more Excel files on the Upload tab first.</p><button class="btn" onclick="go('up')">Go to Upload</button></div>`;
const pick=()=>S.st.length>1?`<select onchange="S.sel=+this.value;S.sc=null;go(S.tab)">${S.st.map((s,i)=>`<option value="${i}" ${i==S.sel?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`:'';
const kp=(l,v,s)=>`<div class="k"><span>${l}</span><b>${v}</b><i>${esc(s||'')}</i></div>`;
const tb=(h,r)=>`<div class="sx"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</table></div>`;
const FL=[['rev','Revenue'],['gp','Gross profit'],['eb','EBITDA'],['ni','Net income'],['cash','Cash'],['burn','Burn'],['cust','Customers'],['cac','CAC'],['ltv','LTV'],['churn','Churn'],['ret','Retention'],['ask','Funding ask'],['pre','Pre-money'],['tam','TAM'],['sam','SAM'],['som','SOM'],['mg','Market growth'],['exp','Team experience'],['comp','Competitors']];
const missing=s=>FL.filter(([k])=>!s.F[k]&&!(k==='eb'&&s.F.ebm)).map(x=>x[1]);
const V={
